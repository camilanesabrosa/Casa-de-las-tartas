<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descargar Casa de las Tartas</title>
  <meta name="description" content="Descargá Casa de las Tartas para Windows de 64 bits.">
  <style>
    :root {
      color-scheme: light;
      --background: #f7f8f5;
      --text: #202722;
      --muted: #626b64;
      --accent: #934fb8;
      --accent-hover: #8143a3;
      --on-accent: #fff;
      --font-body: system-ui, sans-serif;
      --font-data: ui-monospace, monospace;
      --text-title: 32px;
      --text-body: 16px;
      --text-small: 14px;
      --space-1: 4px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: var(--space-8) var(--space-4);
      background: var(--background);
      color: var(--text);
      font: var(--text-body)/1.5 var(--font-body);
    }
    main { width: 100%; max-width: 480px; text-align: center; }
    h1 { margin: 0; font-size: var(--text-title); line-height: 1.2; letter-spacing: -0.03em; text-wrap: balance; }
    .version { margin: var(--space-3) 0 var(--space-6); color: var(--muted); font: var(--text-small)/1.5 var(--font-data); }
    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      text-decoration: none;
    }
    .download:hover { background: var(--accent-hover); }
    .download:active { background: var(--text); }
    .download:focus-visible { outline: 2px solid var(--accent); outline-offset: var(--space-1); }
    .note { margin: var(--space-6) 0 0; color: var(--muted); font-size: var(--text-small); }
    footer { margin-top: var(--space-8); font-size: var(--text-small); }
    footer a { color: var(--text); text-underline-offset: 3px; }
    footer a:hover { color: var(--accent-hover); }
    footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: var(--space-1); }
  </style>
</head>
<body>
  <main>
    <h1>Casa de las Tartas</h1>
    <p class="version">Windows 64 bits · v{{VERSION}} · {{SIZE_MB}} MB</p>
    <a class="download" href="update/{{INSTALLER}}" download>Descargar .exe</a>
    <p class="note">El instalador no tiene firma digital.<br>Windows puede mostrar una advertencia de editor desconocido.</p>
    <footer><a href="privacy-policy/">Política de privacidad</a></footer>
  </main>
</body>
</html>
