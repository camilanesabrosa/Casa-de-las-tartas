# Include inside the HTTPS server block for sinnick.dev.
# Keep downloads outside the main website's document root.
location = /cdt {
    return 301 /cdt/;
}

location ^~ /cdt/ {
    alias /var/www/cdt-download/;
    index index.html;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
